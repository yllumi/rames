# Nama project (komposisi) — tidak bergantung pada nama folder
name: rames

services:
  webman:
    build: .
    # Nama unik (hindari bentrok dengan container webman proyek lain di host)
    container_name: rames-webman
    restart: unless-stopped
    # Jalankan dari direktori proyek (sama dengan path host, lihat volume ${PWD})
    working_dir: "${PWD}"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-example.com}"
      APP_PORT: "${APP_PORT:-8000}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me}"
      PORT_RANGE_START: "${PORT_RANGE_START:-30000}"
      PORT_RANGE_END: "${PORT_RANGE_END:-30999}"
      NGINX_CONF_PATH: "${NGINX_CONF_PATH:-/etc/nginx/sites-available}"
      NGINX_ENABLED_PATH: "${NGINX_ENABLED_PATH:-/etc/nginx/sites-enabled}"
      NGINX_HTTP_CONF: "${NGINX_HTTP_CONF:-/etc/nginx/nginx.conf}"
      NGINX_BIN: "${NGINX_BIN:-/usr/sbin/nginx}"
      NGINX_RELOAD_IMAGE: "${NGINX_RELOAD_IMAGE:-alpine}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      DOCKER_SOCKET: "${DOCKER_SOCKET:-/var/run/docker.sock}"
      DEPLOY_TIMEOUT: "${DEPLOY_TIMEOUT:-600}"
      SSL_CHALLENGE: "${SSL_CHALLENGE:-http}"
      SSL_CA_SERVER: "${SSL_CA_SERVER:-production}"
      SSL_WEBROOT: "${SSL_WEBROOT:-}"
      CLOUDFLARE_CREDS: "${CLOUDFLARE_CREDS:-}"
      # Terminal container (docker exec)
      DOCKER_BINARY: "${DOCKER_BINARY:-docker}"
      TERMINAL_SCRIPT_BIN: "${TERMINAL_SCRIPT_BIN:-script}"
      TERMINAL_RUN_TIMEOUT: "${TERMINAL_RUN_TIMEOUT:-120}"
      TERMINAL_SESSION_TTL: "${TERMINAL_SESSION_TTL:-3600}"
      TERMINAL_IDLE_TIMEOUT: "${TERMINAL_IDLE_TIMEOUT:-900}"
      TERMINAL_MAX_SESSIONS: "${TERMINAL_MAX_SESSIONS:-20}"
      # Halaman /database memakai Adminer (helper container) — tidak ada env
      # koneksi PDO lagi. DB_IMPORT_TIMEOUT tetap dipakai restore dump (DbDump).
      DB_IMPORT_TIMEOUT: "${DB_IMPORT_TIMEOUT:-600}"
      # Halaman /database dilayani Adminer lewat helper container (tanpa port
      # publik, network internal). Nilai bawaan di config/deploy.php sama.
      ADMINER_IMAGE: "${ADMINER_IMAGE:-adminer:6}"
      ADMINER_CONTAINER: "${ADMINER_CONTAINER:-rames-adminer}"
      ADMINER_NETWORK: "${ADMINER_NETWORK:-rames-helpers}"
      ADMINER_WORKERS: "${ADMINER_WORKERS:-8}"
      ADMINER_NETWORK_TTL: "${ADMINER_NETWORK_TTL:-1800}"
      ADMINER_PROXY_TIMEOUT: "${ADMINER_PROXY_TIMEOUT:-30}"
      ADMINER_PROXY_MAX_BYTES: "${ADMINER_PROXY_MAX_BYTES:-67108864}"
      ADMINER_PREFIX_BASE: "${ADMINER_PREFIX_BASE:-/database}"
      # Database dashboard (SQLite) + snapshot backup, disimpan di named volume
      # `rames-data` (nama nyata di host: `rames`) yang dimount ke /var/lib/rames.
      # CATATAN: DATABASE_PATH (database/keys, database/env, database/restic) TIDAK
      # diubah — ketiganya tetap di dalam repo (bind ${PWD}), bukan di volume ini.
      RAMES_DB_DIR: "${RAMES_DB_DIR:-/var/lib/rames}"
      RAMES_DB_BACKUP_DIR: "${RAMES_DB_BACKUP_DIR:-/var/lib/rames/backup}"
      DB_BACKUP_ENABLED: "${DB_BACKUP_ENABLED:-true}"
      DB_BACKUP_HOUR: "${DB_BACKUP_HOUR:-3}"
      DB_BACKUP_KEEP_DAILY: "${DB_BACKUP_KEEP_DAILY:-7}"
      DB_BACKUP_KEEP_WEEKLY: "${DB_BACKUP_KEEP_WEEKLY:-4}"
      DB_BACKUP_KEEP_MONTHLY: "${DB_BACKUP_KEEP_MONTHLY:-3}"
      DB_IMPORT_LEGACY_JSON: "${DB_IMPORT_LEGACY_JSON:-true}"
      # Backup volume harian ke S3 via restic (PLAN_VOLUME_BACKUP.md).
      # Namespace env VOLUME_BACKUP_*/RESTIC_*/AWS_* — JANGAN pakai BACKUP_*
      # (itu milik backup database/*.json + config Nginx, SPECS §8g — terpisah).
      # Kredensial S3 hanya placeholder; nilai nyata diisi via .env (gitignored).
      VOLUME_BACKUP_ENABLED: "${VOLUME_BACKUP_ENABLED:-true}"
      VOLUME_BACKUP_SNAPSHOT_POLICY: "${VOLUME_BACKUP_SNAPSHOT_POLICY:-stop}"
      VOLUME_BACKUP_REQUIRE_STOPPED: "${VOLUME_BACKUP_REQUIRE_STOPPED:-true}"
      VOLUME_BACKUP_STOP_TIMEOUT: "${VOLUME_BACKUP_STOP_TIMEOUT:-120}"
      VOLUME_BACKUP_DUMP_TIMEOUT: "${VOLUME_BACKUP_DUMP_TIMEOUT:-600}"
      VOLUME_BACKUP_DB_DUMP_ENABLED: "${VOLUME_BACKUP_DB_DUMP_ENABLED:-true}"
      VOLUME_BACKUP_TIMEOUT: "${VOLUME_BACKUP_TIMEOUT:-3600}"
      VOLUME_BACKUP_IMAGE: "${VOLUME_BACKUP_IMAGE:-}"
      VOLUME_BACKUP_KEEP_DAILY: "${VOLUME_BACKUP_KEEP_DAILY:-7}"
      VOLUME_BACKUP_KEEP_WEEKLY: "${VOLUME_BACKUP_KEEP_WEEKLY:-4}"
      VOLUME_BACKUP_KEEP_MONTHLY: "${VOLUME_BACKUP_KEEP_MONTHLY:-3}"
      RESTIC_REPOSITORY: "${RESTIC_REPOSITORY:-}"
      RESTIC_PASSWORD_FILE: "${RESTIC_PASSWORD_FILE:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
    volumes:
      # Penting: kode di-mount di path yang SAMA dengan host (${PWD}). Karena
      # docker compose dijalankan DI DALAM container namun daemon-nya di host,
      # relative volume mount di docker-compose.yml milik app harus terselesaikan
      # ke path yang valid di HOST. Jika dimount di /app, path bind jadi
      # "/app/apps/..." yang tidak dikenal daemon host.
      - "${PWD}:${PWD}"
      # Berkas DB SQLite dashboard + snapshot backup-nya, DI LUAR bind ${PWD}:${PWD}
      # agar tidak hilang saat `git clean` / update dashboard, dan tidak tumpang
      # tindih dengan database/keys|env|restic (yang tetap berada di repo).
      - "rames-data:/var/lib/rames"
      # Docker socket agar dashboard bisa mengeksekusi docker compose (Phase 1 known-risk)
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Direktori config Nginx host di-mount ke dashboard container (dashboard hanya menulis file)
      - "${NGINX_CONF_PATH:-/etc/nginx/sites-available}:${NGINX_CONF_PATH:-/etc/nginx/sites-available}"
      - "${NGINX_ENABLED_PATH:-/etc/nginx/sites-enabled}:${NGINX_ENABLED_PATH:-/etc/nginx/sites-enabled}"
      # Status reload yang ditulis watcher di host, dibaca dashboard
      - "./nginx-status:${PWD}/nginx-status"
      # Sertifikat Let's Encrypt: ditulis certbot (di container), dibaca nginx host
      - "/etc/letsencrypt:/etc/letsencrypt"
    ports:
      - "${APP_PORT:-8123}:8787"
    # DNS eksplisit: /etc/resolv.conf di host adalah symlink rusak (stub-resolv.conf
    # tidak ada), sehingga resolver internal Docker tak punya upstream dan container
    # tidak bisa resolve domain eksternal (mis. github.com saat git clone).
    dns:
      - "${DNS_1:-8.8.8.8}"
      - "${DNS_2:-1.1.1.1}"
    # Instal dependensi Composer otomatis jika vendor/ belum ada (mis. clone baru
    # di host tanpa vendor). Karena bind mount ${PWD}:${PWD}, hasil install langsung
    # tersimpan di direktori host dan reusable untuk restart berikutnya.
    # Lalu migrasi skema SQLite + impor sekali data lama (database/*.json) sebelum
    # server start. Tanpa `|| true`: bila salah satu langkah gagal, && menghentikan
    # rantai dan kontainer exit non-zero (fail-fast) — server TIDAK pernah start
    # dengan skema/DB yang belum siap.
    command: ["sh", "-c", "if [ ! -d vendor ]; then composer install --no-dev --optimize-autoloader; fi && php cli/db.php migrate && php cli/db.php import-json && php start.php start"]

# Named volume database dashboard (SQLite + snapshot backup).
# `name: rames` → nama nyata di host = `rames` (bukan rames_rames-data), sehingga
# stabil lintas `docker compose down` dan mudah di-backup/dipindah.
volumes:
  rames-data:
    name: rames
    labels:
      # Penanda volume DB dashboard — dikecualikan dari fitur backup volume app (§8h)
      rames.role: dashboard-db