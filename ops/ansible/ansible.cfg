; Ansible — kontrol server agent Rames (ops/ansible).
; File ini dibaca otomatis bila perintah dijalankan DARI direktori ini.
; Semua modul yang dipakai adalah ansible.builtin (tanpa collection,
; tanpa requirements.yml) sehingga ansible-core polos sudah cukup.

[defaults]
; WAJIB disalin dulu (berkas nyata di-gitignore):
;   cp inventories/agents/hosts.example.yml inventories/agents/hosts.yml
; Tanpa ini `ansible-playbook` mengeluarkan WARNING "No inventory was parsed"
; (dan playbook `hosts: agents` tidak menemukan host apa pun).
inventory = inventories/agents/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
forks = 5
